<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="狹間收容記錄">

<style>
  :root{
    --bg:#07080a; --fg:#c9cdd4; --dim:#8b929c; --gold:#e8a33d; --red:#c0392b;
    --cy:#4aa3c7; --line:#1a1d22; --paper:#0d0f13;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    font-size:16px;line-height:1.9;-webkit-font-smoothing:antialiased;}
  #wrap{max-width:820px;margin:0 auto;padding:24px 20px 80px;}

  /* ── 儀表 ── */
  #hud{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 72%,transparent);
    padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  #vr{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:30px;letter-spacing:.16em;
    color:var(--gold);font-weight:700;}
  #vr .q{color:#565c66;}
  #vr .new{animation:pop .5s ease;}
  @keyframes pop{0%{color:#fff;text-shadow:0 0 18px var(--gold);}100%{color:var(--gold);}}
  #meters{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin-top:6px;}
  #meters b{color:var(--fg);font-weight:600;}
  .bar{display:inline-block;width:64px;height:5px;background:#16191d;border-radius:3px;
    overflow:hidden;vertical-align:middle;margin-left:5px;}
  .bar i{display:block;height:100%;background:var(--cy);}
  .bar.warn i{background:var(--red);}

  /* ── 正文 ── */
  #log p{margin:0 0 .85em;}
  .nar{color:var(--fg);}
  .dim{color:var(--dim);}
  .gold{color:var(--gold);font-weight:600;}
  .red{color:var(--red);font-weight:700;}
  .cy{color:var(--cy);}
  .sys{color:#a3aab4;font-size:13.5px;border-left:2px solid var(--line);padding-left:12px;}
  .head{color:var(--gold);font-size:13px;letter-spacing:.28em;margin:26px 0 10px;
    border-bottom:1px solid var(--line);padding-bottom:8px;}
  .void{color:#6b7280;font-style:italic;}

  /* ── 選項 ── */
  #choices{margin-top:22px;display:flex;flex-direction:column;gap:9px;}
  button.ch{all:unset;cursor:pointer;display:block;padding:13px 16px;background:var(--paper);
    border:1px solid var(--line);border-radius:5px;color:var(--fg);transition:.14s;line-height:1.65;}
  button.ch{touch-action:manipulation;-webkit-tap-highlight-color:rgba(232,163,61,.18);}
  button.ch:hover{border-color:var(--gold);background:#12141a;transform:translateX(3px);}
  @media (max-width:430px){
    #wrap{padding:16px 12px 72px;}
    #vr{font-size:23px;letter-spacing:.12em;}
    button.ch{padding:14px 13px;}
    #meters{gap:12px;font-size:12px;}
  }
  button.ch .tag{color:var(--dim);font-size:11.5px;display:block;margin-top:5px;letter-spacing:.05em;}
  button.ch.danger:hover{border-color:var(--red);}
  button.ch.exit:hover{border-color:var(--cy);}

  /* ── 條目卡 ── */
  .entry{border:1px solid var(--gold);border-radius:6px;padding:18px 20px;margin:22px 0;
    background:#0e0c08;}
  .entry h3{margin:0 0 4px;color:var(--gold);font-size:17px;letter-spacing:.06em;}
  .entry .no{color:var(--dim);font-family:ui-monospace,monospace;font-size:12.5px;letter-spacing:.1em;}
  .entry dl{margin:12px 0 0;font-size:14.5px;}
  .entry dt{color:var(--dim);font-size:12px;letter-spacing:.14em;margin-top:9px;}
  .entry dd{margin:1px 0 0;}

  #foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap;}
  #foot a{color:var(--dim);cursor:pointer;text-decoration:none;border-bottom:1px dotted #333;}
  #foot a:hover{color:var(--gold);border-color:var(--gold);}
  .fade{animation:fi .34s ease;}
  @keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
</style>
</head>

/* ── 關鍵詞百科　★ 由 src/rooms.py 產生 ─────────────── */

/* ── 狹間的房間（未成立 → 觀測後成立）★ 由 src/rooms.py 產生 ─── */
const ROOMS = [
  { id:"corridor", void:"一條沒有長度的東西。你往前走，走了多久都還在同一段。牆是有的，可是牆沒有顏色。",

/* ── 工具 ───────────────────────────────────────── */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function say(cls,html){const p=document.createElement('p');p.className=cls+' fade';p.innerHTML=html;LOG.appendChild(p);scroll();}
function head(t){const d=document.createElement('div');d.className='head fade';d.textContent=t;LOG.appendChild(d);scroll();}
function scroll(){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
function unlock(k){ if(KW[k] && !SEEN_KW.has(k)){ SEEN_KW.add(k); say('sys','§ <span class="gold">－關鍵詞更新－</span>　<b>'+k+'</b>'); } }

function filled(){ return S.digits.filter(d=>d!==null).length; }
function capOf(){ return 7 + filled(); }
function vrText(){
  return '9.' + S.digits.map(d=> d===null ? '<span class="q">?</span>' : '<span class="new">'+d+'</span>').join('');
}
function render(){
  $('#vr').innerHTML = vrText();
  const pct = filled()/6*100;
  const cw = Math.max(0,Math.min(100,Math.round(S.charge/120*100)));
  $('#meters').innerHTML =
    `第 <b>${S.steps||0}</b> 個地方　`+
    `成立度 <b>${filled()}/6</b><span class="bar ${pct>66?'warn':''}"><i style="width:${pct}%"></i></span>`+
    `　武裝 <b>${Math.round(cw)}%</b><span class="bar ${cw<30?'warn':''}"><i style="width:${cw}%"></i></span>`+
    `　無人機 <b>${S.drones}</b>`+
    `　追來的 <b>${S.hunters.length}</b>`+
    (S.ally?`　幫手 <b>${S.ally}</b>`:'')+
    (S.pocket.length?`　口袋 <b>${S.pocket.join('、')}</b>`:'')+
    `　收容壓力 <b>${S.pressure}</b>/${capOf()}`+
    `　擴散 <b>${S.drift}</b>/5`;
  $('#runinfo').textContent = `第 ${RUN} 次　檔案 ${ARCHIVE.length} 件　關鍵詞 ${SEEN_KW.size}/${Object.keys(KW).length}`;
}

/* ── 房間流程 ─────────────────────────────────────── */
function nextRoom(){
  if(S.over) return;
  if(filled()>=6){ return converge(); }
  S.steps++;
  if(S.pool.length===0) S.pool = shuffle(ROOMS.map((r,i)=>i));
  const idx = S.pool.pop();
  const r = ROOMS[idx];
  S.cur = r;
  head(`第 ${S.steps} 個地方`);
  say('void', r.void);
  // ── 千隱世追殺中 ──
  if(S.hunt>0){
    if(S.hunters.length<=2 && S.pressure<capOf()-2){
      S.hunt=0;
      say('sys','【街機版此處切回 music.sound603】');
      say('dim','空氣鬆開了。');
      say('nar','<span style="color:#7aa96a"><b>綠色外套</b></span>站在房間的另一頭，左輪已經回到腰上。');
      say('nar','世「──壓回去了。」');
      say('nar','世「⋯⋯別讓我再來一次。」');
      say('dim','他把懷錶闔上，走了。走廊的燈在他經過的時候，一盞都沒有閃。');
    }else if(S.dodged){
      S.dodged=false;
      say('dim','腳步聲經過了。離你一面牆。');
      say('dim','他沒有發現你——或者他發現了，只是把這一間讓給你。');
      say('red',`追殺中　剩 ${S.hunt} 個房間。`);
    }else if(S.fought){
      S.fought=false;
      S.hunt=Math.min(3,S.hunt+1);
      say('dim','你被推回來的時候，盾少了兩面。');
      say('dim','可是他停了三秒。三秒，夠你拉開一個房間。');
      say('nar','世「⋯⋯有骨氣。」');
      say('red',`追殺中　剩 ${S.hunt} 個房間。`);
    }else{
      S.hunt--;
      if(S.hunt<=0){
        say('dim','門沒有開。他就在裡面等你。');
        say('nar','世「⋯⋯時間到了。」');
        say('gold','<b>虛幻殺手。</b>');
        return corrected();
      }
      say('red', S.hunt===2?'腳步聲進了同一區。不快。他從來不用跑的。':'上膛的聲音。一發。他只裝了一發——因為一發就夠。');
      say('red',`<b>追殺中</b>　剩 ${S.hunt} 個房間。追獵者 ≤ 2 且壓力壓下來，他就會停。`);
    }
  }
  // ★★★ 上一輪被收容的自己，會以既存物件的身分出現在這裡。
  //   這是全作的核心：你死掉留下的條目，是下一個你要面對的東西。
  if(ARCHIVE.length && !S.metArc.length && Math.random()<0.45){
    const e = ARCHIVE[Math.floor(Math.random()*ARCHIVE.length)];
    S.metArc.push(e.no);
    say('dim','這個地方已經有東西了。');
    say('red', `<b>${e.no}　${e.name}</b>`);
    say('dim', e.cls==='已成立'
      ? '它不是追你的。它就是這裡的一部分——它比這個房間先成立。你走進去的是它的內容。'
      : '封存的條目。它安安靜靜擺在那裡，像一份沒有人領走的行李。');
    if(e.cls==='已成立'){ S.pressure += 2; say('sys','壓力 +2　在別人的世界裡，你才是那個不該存在的東西。'); }
    else { S.charge = Math.min(120, S.charge+12); say('sys','武裝 +12%　它剩下的源能還能用。'); }
  }
  // 幫手：站你這邊的那一個
  if(S.ally){
    const a0=S.pressure;
    S.pressure=Math.max(0,S.pressure-1);
    say('dim',`<b>${S.ally}</b>　走在你旁邊。牠在，這裡就鬆一點。（壓力 ${a0} → ${S.pressure}）`);
  }
  // 追來的東西動一步
  if(S.hunters.length){
    const h = S.hunters[S.hunters.length-1];
    if(S.calmstep){
      say('dim', `${h}　停在原地。它需要你先看它一眼。`);
    }else{
      say('dim', `<span class="red">${h}</span>　${HUNTER[h].d}`);
      S.pressure++;
      // ★ 你越成立，越難被收容——收容的是「不該存在的東西」，
      //   而你每固定一格，就多一分「本來就在這裡」。
      if(S.pressure >= capOf()){ return contained(h); }
    }
  }
  S.calmstep = false;
  // ── 千隱世（93 代）巡邏：成立度 4 起靠近 ──
  if(filled()>=4 && !S.qysDone){
    S.qysN++;
    if(S.qysN===1){
      say('dim','<span style="color:#7aa96a">很遠的地方，有一件綠色外套走過。</span>');
      say('dim','他沒有看你。他在看這個地方。');
      unlock('千隱世');
    }else if(S.qysN===2){
      say('dim','<span style="color:#7aa96a">一聲槍響。很遠，悶悶的。</span>');
      say('dim','是某個你走過的房間的方向。那個方向的空氣，鬆了一點。');
      say('sys','★ 他在修正你固定過的地方。');
      unlock('虛幻殺手');
    }else{
      return qysEncounter();
    }
  }
  showRoomChoices();
  render();
}

/* 這一間房的所有選項（觀測＋額外動作＋道具）。用道具之後要重畫，所以抽成一支。 */
function showRoomChoices(){
  const r=S.cur; if(!r||S.over) return;
  const opts = r.obs.map((o,i)=>({
    label:o.t,
    tag: o.exit ? '出去' : (o.cost===0 ? '不觀測　壓力 −1　擴散 +1　武裝 −3' : `觀測　成立度 +1　壓力 +${o.cost}　武裝 −${6+o.cost*2}`+(o.heal?`　武裝 +${o.heal}`:'')),
    cls: o.exit ? 'exit' : (o.cost>=2 ? 'danger' : ''),
    fn:()=>observe(o)
  }));
  // 意聚：手上握著的念頭會自己凝
  if(S.hunters.length>=1 && S.drones>0){
    opts.push({label:'（停下來，什麼都不想）',tag:'壓力 −3　趕走一隻　成立度 ±0　代價：一台無人機',cls:'',fn:suppress});
  }
  if(S.charge<40 && S.drones>0){
    opts.push({label:'（拆一台無人機補電）',tag:'武裝 +30%　代價：一台無人機',cls:'',fn:cannibal});
  }
  // 追殺中的動作
  if(S.hunt>0){
    opts.push({label:'（躲起來）',tag:'他這一步不會逼近　壓力 −1　擴散 +1　武裝 −3',cls:'',fn:dodge});
    if(S.drones>=2){
      opts.push({label:'（正面對抗）',tag:'打不贏。可是牽制得住——他退一個房間　代價：無人機 −2　武裝 −15　壓力 +1',cls:'danger',fn:fight});
    }
  }
  // 口袋
  S.pocket.forEach((it,i)=>{
    opts.push({label:`使用：${it}`,tag:ITEMS[it]?ITEMS[it].desc:'',cls:'exit',fn:()=>useItem(i)});
  });
  choices(opts);
}

function observe(o){
  CH.innerHTML='';
  if(o.exit) return tryExit();
  if(o.cost===0){
    say('nar', o.fix);
    say('dim', o.gain);
    S.calm++;
    if(o.kw) unlock(o.kw);
    say('sys','你沒有看清楚。<b>這一格沒有成立。</b>');
    // ★ 不觀測會降壓——因為狹間沒有東西可以抓著你。
    //   2026-08-18 修：立 calmstep，下一個房間追獵者真的不動（跟旁白一致）。
    const p0=S.pressure;
    S.pressure = Math.max(0, S.pressure-1);
    say('sys',`壓力 ${p0} → ${S.pressure}`);
    S.calmstep = true;
    S.charge -= 3;
    if(o.heal){ S.charge = Math.min(120, S.charge + o.heal + 3); say('sys',`武裝 +${o.heal}`); }
    if(o.item) pickup(o.item);
    S.drift++;
    if(S.hunters.length){ say('dim','後面的東西沒有跟上來。它需要你先看它一眼。'); }
    // ★★★ 可是沒有固定東西 ＝ 狹間繼續擴散。
    //   龜縮不是解法——不觀測的人不會被收容，會直接沒有成立過。
    if(S.drift===2){ say('dim','走廊比剛才長了。你確定剛才沒有這麼長。'); }
    if(S.drift===4){ say('red','你回頭看走過的地方——它們鬆掉了。牆退回沒有顏色，地板退回沒有厚度。'); }
    if(S.drift>=5){ return dissolve(); }
    return after();
  }
  // 固定一位數字
  const d = Math.floor(Math.random()*10);
  const slot = S.digits.indexOf(null);
  if(slot>=0) S.digits[slot]=d;
  say('nar', o.fix);
  say('dim', o.gain);
  if(o.kw) unlock(o.kw);
  say('sys', `<span class="gold">固定。</span>讀數第 ${slot+1} 位寫上了 <b>${d}</b>。`);
  if(S.luck){ say('sys','找零的運氣用掉了——這一眼看得剛剛好，壓力沒有動。'); S.luck=false; }
  else { S.pressure += o.cost; }
  S.charge -= 6 + o.cost*2;
  if(o.heal){ S.charge = Math.min(120, S.charge + o.heal); say('sys',`武裝 +${o.heal}　有些地方對人是好的。`); }
  if(o.item) pickup(o.item);
  S.drift = 0;
  if(o.page && !S.signed){
    say('sys','★ 你手上有一支筆——你在別的地方撿過，或者你只是想到自己有。');
    choices([
      {label:'（在名字欄寫上自己的名字）',tag:'★ 這一格會決定你最後是誰',cls:'exit',fn:()=>signPage(true)},
      {label:'（把紙放回去）',tag:'空白留著。誰都可以填。',cls:'',fn:()=>signPage(false)},
    ]);
    return;
  }
  if(o.spawn && !S.hunters.includes(o.spawn)){
    S.hunters.push(o.spawn);
    say('red', `★ 你觀測了它，所以它成立了。<b>${o.spawn}</b>　開始跟著你。`);
    unlock('意聚生物');
  }
  after();
}

/* ── 空白頁：寫不寫自己的名字 ────────────────────────── */
function signPage(yes){
  CH.innerHTML='';
  if(yes){
    S.signed = true;
    if(!PLAYER_NAME){
      const n = (prompt('名字欄。你要填什麼？','') || '').trim();
      PLAYER_NAME = n.slice(0,12) || '（沒有寫完的那一個）';
    }
    say('nar', `你把名字寫上去了。<span class="gold">${PLAYER_NAME}</span>`);
    say('nar','筆跡是你的。醜，可是是你的。');
    say('sys','★ <b>你替自己填了那一格。</b>從現在起，如果他們收容你，收容的是<b>你</b>，不是一個不明物件。');
    unlock('收容');
  }else{
    S.signed = false;
    say('nar','你把紙放回去，壓平。');
    say('dim','空白留著。誰都可以填——包括這個地方本身。');
    say('sys','那一頁還是空的。而空的東西，總會有人替它填。');
  }
  if(!S.hunters.includes('空白頁')){
    S.hunters.push('空白頁');
    say('red','★ 你觀測了它，所以它成立了。<b>空白頁</b>　開始跟著你。');
    unlock('意聚生物');
  }
  after();
}

/* ── 道具 ─────────────────────────────────────────── */
function pickup(name){
  if(S.pocket.length>=3){ say('sys',`口袋滿了。你把 ${name} 放回去——三樣是你記得住的極限。`); return; }
  S.pocket.push(name);
  say('sys',`§ 拿到了 <span class="gold">${name}</span>　${ITEMS[name]?ITEMS[name].desc:''}`);
}
function useItem(idx){
  const name=S.pocket[idx]; if(!name) return;
  S.pocket.splice(idx,1);
  say('nar', ITEMS[name].use);
  if(name==='布丁'){
    if(S.hunters.length){
      const h=S.hunters.pop(); S.ally=h;
      say('nar',`${h}　停下來了。牠吃得很認真。`);
      say('sys',`★ <b>${h}</b> 站到你這邊了。有牠在，每個房間壓力 −1。`);
    }else{
      S.charge=Math.min(120,S.charge+10);
      say('dim','沒有東西跟著你。你自己吃了。很好吃。武裝 +10。');
    }
  }else if(name==='零件'){
    if(S.drones>=6){ say('dim','庫存是滿的。你把零件收好——收好的下一秒它不見了。這裡不留多餘的東西。'); }
    else{ S.drones++; say('sys',`無人機 +1（現在 ${S.drones} 台）。拼回來的這台飛得有點歪，可是它在。`); }
  }else if(name==='找零的運氣'){
    S.luck=true;
    say('sys','下一次觀測不會加壓。運氣這種東西，用在刀口上。');
  }else if(name==='普通的一天'){
    const d0=S.drift; S.drift=0;
    say('sys',`擴散 ${d0} → 0。日常把鬆掉的地方全部壓回去了。`);
    const i=S.hunters.indexOf('買到的那一天');
    if(i>=0){ S.hunters.splice(i,1); say('dim','「買到的那一天」不再跟著你——它被打開了，它完成了。'); }
  }else if(name==='錯誤的名字'){
    if(S.hunters.length){
      const h=S.hunters[S.hunters.length-1];
      S.pressure+=2;
      const d=Math.floor(Math.random()*10); const slot=S.digits.indexOf(null);
      if(slot>=0){ S.digits[slot]=d; say('sys',`<span class="gold">固定。</span>讀數第 ${slot+1} 位寫上了 <b>${d}</b>。`); }
      say('red',`${h}　氣到現形了。壓力 +2——可是現形的東西，輪廓最清楚。`);
    }else{
      say('dim','你對著空氣喊錯了一個名字。安靜。有一點尷尬。名字浪費掉了。');
    }
  }
  render();
  showRoomChoices();
}

/* ── 千隱世（93 代）─────────────────────────────────── */
function qysEncounter(){
  S.qysDone=true; S.qysN=0;
  head('巡邏');
  say('nar','<span style="color:#7aa96a"><b>綠色外套。</b></span>金色左輪還在腰上，錶鏈從口袋垂下來。');
  say('nar','世「這裡的讀數在動。」');
  if(S.hunters.length>=3 || S.pressure>=capOf()-2){
    say('nar','世「巡邏。發現失控觀測體。」');
    say('nar','世「⋯⋯沒有惡意。只是你停不下來了。」');
    say('dim','他沒有拔槍。他把懷錶打開，按了一下。');
    // ★ 換曲是放給玩家聽的，角色聽不到 BGM。旁白只寫界內徵兆。
    say('sys','【街機版此處切換 music.sound789——他在追殺人時的那一首】');
    say('red','空氣繃緊了。這裡到出口之間的每一扇門，都輕輕闔了一次。');
    S.hunt=3;
    say('nar','世「三個房間。」');
    say('nar','世「把你自己壓回去。不然我來。」');
    showRoomChoices(); render();
    return;
  }
  say('nar','世「──還壓得住。」');
  if(S.hunters.length){
    const h=S.hunters.pop();
    say('dim',`他抬手，一發。<span class="red">${h}</span>　散掉了——不是死掉，是退回沒定型的樣子。`);
  }
  const p0=S.pressure; S.pressure=Math.max(0,S.pressure-3);
  say('sys',`壓力 ${p0} → ${S.pressure}`);
  say('nar','世「這一帶我修過了。」');
  say('nar','世「別讓我再來一次。」');
  say('dim','他走了。三個房間之外，槍聲響了一次——別的地方也有讀數在動。');
  showRoomChoices(); render();
}
function corrected(){
  S.over=true; CH.innerHTML='';
  head('修　正');
  say('nar','你看見金色的光。');
  say('nar','沒有痛。虛毀彈打散的不是身體，是「正在成立」這件事本身。');
  say('nar','你看見這個地方退回沒有顏色的樣子。');
  say('nar','然後你看見這個地方沒有你。');
  say('sys','讀數退回 <b>9.??????</b>。');
  say('dim','他把彈殼撿起來收好，在懷錶上按了一下。');
  say('nar','世「巡邏，結束。」');
  unlock('千隱世'); unlock('虛幻殺手');
  archiveMe('虛幻殺手');
  endCard();
}

function dodge(){
  if(!S.hunt||S.over) return;
  CH.innerHTML='';
  say('nar','你找了一個他還沒成立的角落，把呼吸關小。');
  const p0=S.pressure; S.pressure=Math.max(0,S.pressure-1);
  say('sys',`壓力 ${p0} → ${S.pressure}`);
  S.charge-=3; S.drift++; S.dodged=true; S.calmstep=true;
  if(S.drift>=5) return dissolve();
  after();
}
function fight(){
  if(!S.hunt||S.over||S.drones<2) return;
  CH.innerHTML='';
  say('nar','你把盾全部展開，衝過去。');
  say('nar','他沒有躲。');
  say('red','⋯⋯三秒。');
  S.drones-=2; S.charge-=15; S.pressure+=1; S.fought=true;
  if(S.charge<=0) return contained('沒電');
  nextRoom();
}

function suppress(){
  CH.innerHTML='';
  say('nar','你停下來。');
  say('nar','不看、不聽、不數、不叫任何人的名字。');
  S.drones--;
  const p0=S.pressure;
  S.pressure = Math.max(0, S.pressure-3);
  say('sys',`壓力 ${p0} → ${S.pressure}`);
  S.calmstep = true;   // ★ 花無人機買來的安靜——追獵者這一步不動
  if(S.hunters.length){
    const gone = S.hunters.pop();
    say('dim', `<b>${gone}</b>　鬆掉了。它退回還沒定型的樣子。`);
  }
  say('sys','武裝掉了一台無人機——維持不觀測的狀態要靠它替你擋掉環境訊號。');
  // ★ 「停下來」不累積擴散：它是你花一台無人機主動買來的，
  //   跟「什麼都不看」不一樣。不然壓力一高就兩邊都是死路。
  unlock('無人機庫存');
  if(S.drones<=0){ say('red','無人機庫存見底。刀只剩半截，盾拼不出來。'); }
  after();
}

function cannibal(){
  CH.innerHTML='';
  S.drones--; S.charge = Math.min(120, S.charge+30);
  say('nar','你把一台無人機拆開，把裡面剩下的源能倒回武裝匣。');
  say('dim','它不會再組回來了。刀會少一段，盾會薄一層。');
  unlock('無人機庫存'); unlock('特勤武裝');
  if(S.drones<=0) say('red','庫存見底。');
  after();
}

function after(){
  render();
  if(S.charge<=0){ return contained('沒電'); }
  choices([{label:'往前走',tag:'',fn:nextRoom}]);
}

function tryExit(){
  say('nar','你把手放在那個開口上。');
  const f = filled();
  if(f<3){
    say('nar','推不動。');
    say('sys','這個地方還太不成立了——<b>連門都還沒有厚度</b>。你至少要固定三格，門才推得動。');
    return after();
  }
  say('nar','推得動。');
  say('nar','另一側是白的。你走進去。');
  if(S.hunt>0){
    S.hunt=0;
    say('dim','歌在你背後停了。');
    say('dim','他沒有跟出來。門外沒有讀數可以修。');
    say('gold','★ 成功逃離。');
  }
  return converge(true);
}

/* ── 結束：收束 ───────────────────────────────────── */
function converge(early){
  S.over=true; CH.innerHTML='';
  const f=filled();
  head('收束');
  if(early && f<6){
    say('nar','你走出去了。');
    say('nar','身後那個地方沒有跟上來——它還是一團沒有寫完的東西，你只固定了它的一部分。');
    say('nar',`讀數停在 <span class="gold">9.${S.digits.map(d=>d===null?'?':d).join('')}</span>。`);
    say('nar','沒有人來收容你。');
    say('nar','因為你也沒有真的成立。');
    say('sys','<b>〈走出去了，可是沒有人記得〉</b>　——這一次，仍然沒能改變什麼。');
    unlock('收束');
    archiveMe('自行離開');
    return endCard();
  }
  say('nar','第六位填上去的那一瞬間，八個字全部亮起來。');
  say('nar',`<span class="gold">9.${S.digits.join('')}</span>`);
  say('nar','狹間停止了擴散。');
  say('nar','牆有了顏色，地板有了厚度，光有了方向。');
  say('nar','這個地方成立了。');
  say('nar','而你在裡面。');
  say('sys','<b>你不是逃出來的人。你是這個世界的第一項內容。</b>');
  unlock('收束');
  archiveMe('自行收束');
  endCard();
}

/* ── 結束：擴散（龜縮的代價）───────────────────────── */
function dissolve(){
  S.over=true; CH.innerHTML='';
  head('擴散');
  say('nar','你什麼都沒有看清楚。');
  say('nar','所以什麼都沒有成立。');
  say('nar','包括你站的地方，包括你走過的路，包括——');
  say('nar','你伸手看自己的手。手的邊緣沒有線。');
  say('nar','你想不起來自己的名字是幾個字。');
  say('nar','不是忘記。是那個東西還沒有被寫下來過。');
  say('sys','<b>沒有人來收容你。收容需要對象。</b>');
  say('sys','你不是被消滅的。你是<b>沒有成立過</b>。');
  say('sys','★ 這一輪不會留下檔案——因為沒有東西可以歸檔。');
  unlock('狹間'); unlock('觀測即固定');
  endCard();
}

function contained(by){
  S.over=true; CH.innerHTML='';
  head('收容');
  if(by==='沒電'){
    say('nar','武裝的燈一盞一盞熄掉。');
    say('nar','刀先散掉，然後是盾，最後是手電筒。');
    say('nar','你站在一個還沒有寫完的地方，手上什麼都沒有。');
  }else{
    say('red', `<b>${by}</b>　追上來了。`);
    say('nar','它沒有攻擊你。它只是站在你面前，然後停下來——');
    say('nar','像在等你看清楚它。');
    say('nar','你看清楚了。');
  }
  say('nar','後面的腳步聲是八個人，武裝全開，隊形沒有亂。');
  say('nar','他們沒有喊停，也沒有問你的名字。');
  say('nar','他們只是把你走過的每一個地方，從後面一格一格固定下來。');
  say('sys','標準流程。<b>被收容的東西不會消失，它會變成一個條目。</b>');
  unlock('收容');
  archiveMe(by==='沒電' ? '能源耗盡' : by);
  endCard();
}

function archiveMe(cause){
  const no = 'RC-9-' + String(100+ARCHIVE.length*7+RUN).slice(-3);
  const cls = filled()>=6 ? '已成立' : (filled()>=3 ? '部分成立' : '未成立');
  const e = {
    no, cls, cause,
    vr:'9.'+S.digits.map(d=>d===null?'?':d).join(''),
    steps:S.steps,
    hunters:S.hunters.slice(),
    signed: !!S.signed,
    name: S.signed ? (PLAYER_NAME||'（你自己填的那個名字）') : nameMe()
  };
  ARCHIVE.push(e);
  showEntry(e);
}
function nameMe(){
  const a=['數過拍子的','叫過名字的','沒有回頭的','把紙翻過去的','聽得出頻率的','比自己晚半拍的','推開門的','站著等的'];
  const b=['意聚者','觀測者','那一個','第二十五個','空白頁上的名字'];
  return a[Math.floor(Math.random()*a.length)]+b[Math.floor(Math.random()*b.length)];
}
function showEntry(e){
  const d=document.createElement('div'); d.className='entry fade';
  d.innerHTML=`<div class="no">${e.no}</div><h3>${e.name}</h3>
    <dl>
      <dt>收容分級</dt><dd>${e.cls}</dd>
      <dt>停止時的讀數</dt><dd style="font-family:ui-monospace,monospace;letter-spacing:.12em">${e.vr}</dd>
      <dt>觀測次數</dt><dd>${e.steps} 個地方</dd>
      <dt>結束原因</dt><dd>${e.cause}</dd>
      <dt>伴隨成立的物件</dt><dd>${e.hunters.length? e.hunters.join('、') : '（無）'}</dd>
      <dt>名字欄</dt><dd>${e.signed
        ? '<span class="gold">由本人填寫。</span>'
        : '<span class="dim">空白。本欄由收容方代填。</span>'}</dd>
      <dt>處置</dt><dd>${e.cause==='虛幻殺手'
        ? '不予封存。該項目已被修正，相關讀數已回收。'
        : e.cls==='已成立'
        ? '不予移除。該項目已構成該區域之基礎內容，移除將導致區域退回未成立狀態。'
        : '封存。★ 下一次有觀測者進入本區域時，本條目將作為既存物件出現。'}</dd>
      ${e.signed?'<dt>備註</dt><dd class="gold">本項目於收容前已自行完成登記。<br>依規定，登記在案者不列為「不明物件」——列為<b>人員</b>。</dd>':''}
    </dl>`;
  LOG.appendChild(d); scroll();
}

function endCard(){
  render();
  choices([
    {label:'再來一次',tag:`已經留下 ${ARCHIVE.length} 件檔案。它們會在下一輪出現。`,fn:newRun},
    {label:'看收容檔案',tag:'',fn:showArchive},
    {label:'看關鍵詞',tag:'',fn:showKw},
  ]);
}

/* ── UI ───────────────────────────────────────────── */
function choices(list){
  CH.innerHTML='';
  list.forEach(o=>{
    const b=document.createElement('button');
    b.className='ch fade'+(o.cls?' '+o.cls:'');
    b.innerHTML=o.label+(o.tag?`<span class="tag">${o.tag}</span>`:'');
    b.onclick=()=>{ CH.innerHTML=''; o.fn(); };
    CH.appendChild(b);
  });
  scroll();
}
function showArchive(){
  head('收容檔案');
  if(!ARCHIVE.length) say('dim','（還沒有任何條目。）');
  else ARCHIVE.forEach(showEntry);
  endCardLite();
}
function showKw(){
  head('關鍵詞');
  const ks=Object.keys(KW);
  ks.forEach(k=>{
    if(SEEN_KW.has(k)) say('nar',`<span class="gold">${k}</span>　<span class="dim">${KW[k]}</span>`);
    else say('dim',`<span class="void">■■■■</span>　<span class="void">（未解鎖）</span>`);
  });
  endCardLite();
}
function endCardLite(){
  choices([{label:'回去',tag:'',fn:()=>{ if(S && !S.over) after(); else endCard(); }}]);
}
$('#lnkArc').onclick=showArchive;
$('#lnkKey').onclick=showKw;
$('#lnkNew').onclick=()=>{ if(confirm('重新開始？收容檔案會保留。')) newRun(); };

newRun();
</script>
</body>
</html>
