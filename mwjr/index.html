<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="無妄之刻">
<title>無妄之刻：重製版</title>
<style>
:root{--bg:#0a070d;--fg:#cdc7d4;--dim:#877f92;--vio:#c58ae0;--vio2:#8a5aa8;
  --cyan:#6fc3d8;--line:#221a2a;--paper:#120d17;--gold:#d8b34a;--red:#b3454f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(197,138,224,.15);}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
  font-size:16.5px;line-height:1.95;-webkit-font-smoothing:antialiased;}
#wrap{max-width:760px;margin:0 auto;padding:0 16px 130px;}
/* ── 抬頭 ── */
#hud{position:sticky;top:0;z-index:9;background:linear-gradient(180deg,var(--bg) 78%,transparent);
  padding:12px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:14px;}
#hud .ct{color:var(--vio);font-weight:700;letter-spacing:.1em;font-size:17px;}
#hud .tp{color:var(--dim);font-size:12.5px;margin-top:2px;}
#hud .tp b{color:var(--fg);font-weight:500;}
#hud .bgm{float:right;color:#5a5264;font-size:11.5px;margin-top:3px;}
/* ── 本文 ── */
.ln{margin:0 0 10px;}
.n{color:var(--dim);}
.s .who{color:var(--vio);font-weight:700;margin-right:.4em;}
.s .tx{color:var(--fg);}
.crack{border-left:3px solid var(--vio2);padding-left:12px;color:var(--dim);}
.crack.done{color:#5a5264;text-decoration:line-through;}
.now{color:#fff;border-left:3px solid var(--vio);padding-left:12px;}
.bill{color:#5a5264;font-size:12.5px;letter-spacing:.2em;}
.zhou{border:1px solid #274b56;background:#0d1418;border-radius:10px;padding:12px 14px;margin:0 0 12px;}
.zhou .zt{color:var(--cyan);font-weight:700;letter-spacing:.15em;}
.zhou .zx{color:#e8f4f8;margin:6px 0;}
.zhou .zf{color:#4e6b74;font-size:13px;}
.pickecho{color:var(--gold);margin:2px 0 12px;}
.pickecho::before{content:"→ ";color:#8a763d;}
.div{display:flex;align-items:center;gap:10px;color:#5a5264;font-size:12.5px;margin:20px 0 16px;}
.div::before,.div::after{content:"";flex:1;height:1px;background:var(--line);}
.chcard{margin:26px 0 22px;text-align:center;}
.chcard .t{color:var(--vio);font-size:21px;font-weight:700;letter-spacing:.3em;}
.chcard .u{color:#5a5264;font-size:12px;margin-top:4px;letter-spacing:.4em;}
/* ── 選項 ── */
#choices{margin:6px 0 14px;}
#choices .q{color:var(--gold);margin-bottom:10px;}
button.opt{all:unset;display:block;width:100%;cursor:pointer;padding:13px 15px;margin:0 0 9px;
  background:var(--paper);border:1px solid #2c2136;border-radius:9px;color:var(--fg);
  touch-action:manipulation;}
button.opt:active{border-color:var(--vio);background:#191221;}
/* ── 底列 ── */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:linear-gradient(0deg,var(--bg) 82%,transparent);padding:10px 14px 22px;}
#barin{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:stretch;}
button.bb{all:unset;cursor:pointer;text-align:center;border-radius:11px;padding:14px 0;
  touch-action:manipulation;font-weight:700;letter-spacing:.15em;}
#bnext{flex:1;background:#1a1322;border:1px solid #322640;color:var(--fg);}
#bnext:active{border-color:var(--vio);}
#bcast{width:118px;background:#120d17;border:1px solid #241b2e;color:#4a4256;}
#bcast.on{background:#1e1029;border-color:var(--vio);color:var(--vio);
  animation:glow 1.6s ease-in-out infinite;}
@keyframes glow{50%{box-shadow:0 0 14px rgba(197,138,224,.35);}}
#bmenu{width:56px;background:#120d17;border:1px solid #241b2e;color:var(--dim);}
/* ── 疊層 ── */
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,3,8,.96);display:none;
  overflow-y:auto;padding:40px 20px 60px;}
.ov.show{display:block;}
.ovin{max-width:560px;margin:0 auto;}
.ov h2{color:var(--vio);letter-spacing:.25em;font-size:22px;text-align:center;margin:30px 0 6px;}
.ov .sub{color:var(--dim);text-align:center;font-size:13px;margin-bottom:26px;}
button.mb{all:unset;display:block;width:100%;cursor:pointer;text-align:center;
  padding:15px 0;margin:0 0 12px;background:var(--paper);border:1px solid #2c2136;
  border-radius:10px;color:var(--fg);letter-spacing:.2em;touch-action:manipulation;}
button.mb:active{border-color:var(--vio);}
button.mb.dim{color:var(--dim);}
button.mb b{color:var(--vio);}
.endt{color:var(--vio);font-size:24px;letter-spacing:.3em;text-align:center;margin:70px 0 10px;}
.endc{color:var(--dim);text-align:center;font-size:14px;}
.endx{color:#6b6276;text-align:center;margin:30px 0;letter-spacing:.2em;}
.hour{color:#5a5264;text-align:center;letter-spacing:1.2em;margin:50px 0;font-size:15px;}
.coll{color:#5a5264;font-size:12.5px;text-align:center;margin-top:34px;}
.coll b{color:var(--gold);font-weight:500;}
/* 回想 */
.lg{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:10px;background:var(--paper);}
.lg .t1{font-weight:700;}
.lg.cast .t1{color:var(--vio);}
.lg.hold .t1{color:#5a5264;}
.lg .meta{color:#5a5264;font-size:12px;margin:2px 0 6px;}
.lg .was{color:var(--dim);font-size:13.5px;}
.lg .now{border:none;padding:0;color:var(--fg);font-size:13.5px;}
.lg .at{color:#5a5264;font-size:12px;margin-top:5px;}
.help p{color:var(--dim);margin:0 0 12px;}
.help b{color:var(--fg);font-weight:600;}
.help .vio{color:var(--vio);}
@media (max-width:420px){#wrap{padding:0 12px 128px;} html,body{font-size:16px;}}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span class="bgm" id="hbgm"></span>
    <div class="ct" id="hch">無妄之刻：重製版</div>
    <div class="tp" id="htp"></div>
  </div>
  <div id="scr"></div>
  <div id="choices"></div>
  <div style="height:30px"></div>
</div>

<div id="bar"><div id="barin">
  <button class="bb" id="bmenu">☰</button>
  <button class="bb" id="bnext">➤　下一句</button>
  <button class="bb" id="bcast">❖ 無妄</button>
</div></div>

<!-- 標題 -->
<div class="ov show" id="ovtitle"><div class="ovin">
  <h2 style="margin-top:90px">無妄之刻</h2>
  <div class="sub">重　製　版</div>
  <div id="tbtns"></div>
  <div class="coll" id="tcoll"></div>
</div></div>

<!-- 結局 -->
<div class="ov" id="ovend"><div class="ovin">
  <div class="endt" id="edisp"></div>
  <div class="endc" id="ecnt"></div>
  <div class="endx" id="eextra"></div>
  <div class="hour" id="ehour" style="display:none">沙　漏</div>
  <button class="mb" id="eback" style="margin-top:50px">回到標題</button>
  <div class="coll" id="ecoll"></div>
</div></div>

<!-- 門 -->
<div class="ov" id="ovdoor"><div class="ovin">
  <h2>逆流之後</h2>
  <div class="sub">再走一次同樣的三天。這一次，你身邊多了記得的東西。</div>
  <div id="doorbtns"></div>
</div></div>

<!-- 回想 -->
<div class="ov" id="ovlog"><div class="ovin">
  <h2>回　想</h2>
  <div class="sub" id="lgcnt"></div>
  <div id="lglist"></div>
  <button class="mb" id="lgback">回去</button>
</div></div>

<!-- 選單 -->
<div class="ov" id="ovmenu"><div class="ovin">
  <h2 style="font-size:18px">選　單</h2>
  <div class="sub"></div>
  <button class="mb" id="mlog">回想</button>
  <button class="mb" id="mhelp">怎麼玩</button>
  <button class="mb" id="mtitle">回到標題<br><span style="font-size:12px;color:#5a5264">進度存著。</span></button>
  <button class="mb" id="mback">回去</button>
</div></div>

<!-- 說明 -->
<div class="ov" id="ovhelp"><div class="ovin help">
  <h2 style="font-size:18px">怎麼玩</h2>
  <div class="sub"></div>
  <p>① <b>一句一點</b>。不計時，不自動捲。</p>
  <p>② 遇到<b>選項</b>，換你了。<b>沒有哪一個是對的。</b></p>
  <p>③ 有些場面過完，右下角那顆會<span class="vio">亮起來</span>——那裡有一道縫。點下去，把剛剛那一段<b>改寫掉</b>。兩個版本你都會看到。</p>
  <p>④ 無妄的代價永遠不顯示數字。<b>回想</b>只寫事實。</p>
  <p>⑤ 咒言是自己付錢的力量——每一筆都開在畫面上。</p>
  <p style="color:#5a5264;font-size:13px">進度自動儲存在這支手機的瀏覽器裡。</p>
  <button class="mb" id="hback">回去</button>
</div></div>

雙手合十，頭低到不能再低。"},"14":{"k":"s","w":"劉嘉玲","t":"「好吧。那就當一切回到原點。」"},"15":{"k":"s","w":"劉嘉玲","t":"「先自我介紹，我是劉嘉玲。」"},"16":{"k":"n","t":"這個名字很熟。熟到我想不起來反而奇怪。"},"17":{"k":"s","w":"劉嘉玲","t":"「我是無妄使徒之一。不過不是海垣出生的，藍月城人。」"},"18":{"k":"s","w":"我","t":"「連藍月城都有無妄使徒嗎。」"},"19":{"k":"s","w":"劉嘉玲","t":"「正確來說，我是源能不適應病的患者。」"},"20":{"k":"s","w":"劉嘉玲","t":"「多虧了 SEA，我才得救。」"},"21":{"k":"n","t":"SEA。源能抗體。舊特爾克德那批人研發出來的東西。"},"22":{"k":"s","w":"劉嘉玲","t":"「我體內的 SEA，是從海垣一棵樹上取下來的。」"},"23":{"k":"s","w":"劉嘉玲","t":"「那棵樹不斷在釋放 SEA 細胞，取多少都不會枯。」"},"24":{"k":"s","w":"劉嘉玲","t":"「所以我對那棵樹，抱有一萬分的感恩之心。」"},"25":{"k":"n","t":"⋯⋯等一下。"},"26":{"k":"n","t":"位於海垣，而且還在不斷釋放 SEA 的樹。"},"27":{"k":"n","t":"那不就是我嗎。"},"28":{"k":"n","t":"我沒有把這句話講出來。我只是把手指在褲縫上摳了兩下。"},"29":{"k":"s","w":"劉嘉玲","t":"「然後那棵樹現在不認識我。」"},"30":{"k":"s","w":"劉嘉玲","t":"「那我就當作我也不認識那棵樹。」"},"31":{"k":"s","w":"劉嘉玲","t":"「等他想認識我，我再進一步自我介紹。」"},"32":{"k":"s","w":"我","t":"「好啦好啦，我知道了嘛。我想多知道一點妳的事。」"},"33":{"k":"s","w":"劉嘉玲","t":"「如果說你是一棵樹，那你放出來的 SEA 細胞就是種子吧？」"},"34":{"k":"s","w":"我","t":"「要這麼說好像也可以。」"},"35":{"k":"s","w":"劉嘉玲","t":"「那如果樹的意識透過靈脈逆流了，身為種子的我會怎樣？」"},"36":{"k":"c","q":"（她在等我接話）","o1":"「會開花？」","o2":"「會跟著妳的意識一起逆流。」","f2":"own+1"},"37":{"k":"s","w":"劉嘉玲","t":"「開你妹。」"},"38":{"k":"s","w":"劉嘉玲","t":"「是會跟著樹的意識一起逆流啦。」"},"39":{"k":"s","w":"劉嘉玲","t":"「不過種子自己不會發芽，得有養分。」"},"40":{"k":"s","w":"劉嘉玲","t":"「而那個養分，就是你的無妄之力。」"},"41":{"k":"s","w":"我","t":"「所以我對妳發動無妄，才會把妳叫醒。」"},"42":{"k":"s","w":"劉嘉玲","t":"「賓果。」"},"43":{"k":"n","t":"她說賓果的時候笑得很得意，像等這一句等了很久。"},"44":{"k":"s","w":"我","t":"「那，被叫醒的種子妹妹——」"},"45":{"k":"s","w":"劉嘉玲","t":"「改口。」"},"46":{"k":"s","w":"我","t":"「嘉⋯⋯嘉玲？」"},"47":{"k":"s","w":"劉嘉玲","t":"「唉。」"},"48":{"k":"n","t":"唉什麼啦。這孩子也太愛撒嬌了吧。"},"49":{"k":"s","w":"我","t":"「玲⋯⋯玲玲？」"},"50":{"k":"s","w":"劉嘉玲","t":"「很好。」"}},"n":50},"2":{"time":"第一天・入夜","place":"中央區　飯店　三零一號房","route":"共通","bgm":"m_cost","lines":{"1":{"k":"n","t":"等我們把話題轉回正事，窗外已經暗了一半。"},"2":{"k":"s","w":"我","t":"「先講今晚。在我記得的版本裡，妳半夜會墜樓。」"},"3":{"k":"s","w":"劉嘉玲","t":"「嗯。那是必然的。」"},"4":{"k":"s","w":"我","t":"「必⋯⋯必然？」"},"5":{"k":"s","w":"劉嘉玲","t":"「雖然我很不想承認，也不想開——」"},"6":{"k":"n","t":"話講到一半，她整個人彎了下去。"},"7":{"k":"s","w":"劉嘉玲","t":"「咳、咳咳⋯⋯」"},"8":{"k":"s","w":"我","t":"「妳還好吧！」"},"9":{"k":"s","w":"劉嘉玲","t":"「咳⋯⋯如果可以，我實在不想讓你看到這樣的我。」"},"10":{"k":"s","w":"劉嘉玲","t":"「這就是我會墜樓的原因。這具身體，一點也不堪用。」"},"11":{"k":"n","t":"我去飲水機裝了一杯水回來。她接過去的時候，手在抖。"},"12":{"k":"s","w":"劉嘉玲","t":"「謝謝你唷。」"},"13":{"k":"s","w":"我","t":"「妳的身體到底怎麼了。」"},"14":{"k":"s","w":"劉嘉玲","t":"「我剛剛講過了吧，源能不適應病。」"},"15":{"k":"s","w":"劉嘉玲","t":"「SEA 的藥效很好，本來快把我治好了。」"},"16":{"k":"n","t":"源能是這個國境的主流能源，也是很多意聚者的命。"},"17":{"k":"n","t":"不可能不用，更不可能消失，因為根本沒有替代品。"},"18":{"k":"n","t":"而她的身體，剛好對它排斥到會死。"},"19":{"k":"s","w":"劉嘉玲","t":"「你在替我擔心呀？眉頭鎖成那樣，會長皺紋喔。」"},"20":{"k":"n","t":"她伸手揉了揉我的額頭，完全不忌諱我是個男的。"},"21":{"k":"s","w":"我","t":"「那個病，為什麼會突然變嚴重。」"},"22":{"k":"s","w":"劉嘉玲","t":"「如果我說了，你還願意繼續堅持下去嗎？」"},"23":{"k":"s","w":"我","t":"「堅持什麼。」"},"24":{"k":"s","w":"劉嘉玲","t":"「堅持你想改掉那個結局的心。」"},"25":{"k":"n","t":"⋯⋯我答應過妳了。也答應過那些替我想辦法的人了。"},"26":{"k":"s","w":"我","t":"「我會堅持下去。」"},"27":{"k":"s","w":"劉嘉玲","t":"「我會惡化，是因為體內的種子滲進了源能。」"},"28":{"k":"s","w":"我","t":"「滲進源能⋯⋯什麼意思。」"},"29":{"k":"s","w":"劉嘉玲","t":"「我跟你有同樣的力量，但那力量源自於你。」"},"30":{"k":"s","w":"劉嘉玲","t":"「你的無妄和其他使徒不一樣，是靠逆轉源能達成的。」"},"31":{"k":"s","w":"劉嘉玲","t":"「所以每當你使用一次靈脈逆轉——」"},"32":{"k":"s","w":"劉嘉玲","t":"「我體內那些本來幫我排除源能的 SEA 細胞。」"},"33":{"k":"s","w":"劉嘉玲","t":"「反而會湧入更多的源能到我的體內。」"},"34":{"k":"n","t":"我聽懂了。"},"35":{"k":"n","t":"不是詛咒，不是報應，也不是什麼壽命被誰抽走。"},"36":{"k":"n","t":"那些細胞是我放出去的，現在正在她身上反過來做這件事。"},"37":{"k":"n","t":"我用一次，它們就對她做一次。就這麼簡單。"},"38":{"k":"s","w":"劉嘉玲","t":"「所以我才說，希望你不要聽到這些就放棄堅持。」"},"39":{"k":"s","w":"劉嘉玲","t":"「如果你沒遇到我有多好，如果我不認識你有多好。」"},"40":{"k":"s","w":"劉嘉玲","t":"「每一次，都是如此。」"},"41":{"k":"n","t":"我的手在抖。不是怕，是那個熟悉的、要壞掉的感覺。"},"42":{"k":"n","t":"胸口有東西往上頂。我把嘴巴張開又閉上，什麼都沒發出來。"},"43":{"k":"n","t":"冷靜。不能在這裡崩。在她面前崩，是最爛的一種。"},"44":{"k":"m","title":"把這段話收回去","was":"她把話講完了，我也聽完了。從現在起我每動一次手，都得先想一遍她體內那些細胞在幹什麼。","now":"這段對話沒有發生。她咳完那一陣就把杯子放下，聊起了明天想吃什麼，而我什麼都不知道。"},"45":{"k":"n","t":"我把手放回膝蓋上，壓住。"},"46":{"k":"s","w":"我"," ","w":"我","t":"「反效果⋯⋯會怎樣。」"},"28":{"k":"s","w":"劉嘉玲","t":"「無妄之力會失控。你會瞬間摧毀整個世界。」"},"29":{"k":"n","t":"她講這句話的時候沒有笑。"},"30":{"k":"s","w":"劉嘉玲","t":"「所以無論如何都要記住。」"},"31":{"k":"s","w":"劉嘉玲","t":"「絕對，不可以崩潰。」"},"32":{"k":"s","w":"劉嘉玲","t":"「不可以丟掉心裡最後那道防線。」"},"33":{"k":"s","w":"劉嘉玲","t":"「只有這樣，你才鎖得住那股力量。」"},"34":{"k":"n","t":"我沒有告訴她，我這輩子最不擅長的就是這件事。"},"35":{"k":"n","t":"別人可以承受的東西，到我這裡常常直接見底。"},"36":{"k":"n","t":"我自己知道。所以我一直在忍。"},"37":{"k":"s","w":"劉嘉玲","t":"「還有，你不覺得志雄一直在刻意引導你逆流嗎？」"},"38":{"k":"n","t":"這麼說來，的確每一次都是。"},"39":{"k":"s","w":"劉嘉玲","t":"「用無妄搭出一個會真的死人的攝影棚。」"},"40":{"k":"s","w":"我","t":"「為的就是把我逼出來，逼我做靈脈逆流。」"},"41":{"k":"n","t":"手段爛歸爛，但他們背後一定有更大的東西。"},"42":{"k":"n","t":"晚上十點，特勤在頂樓集合。"},"43":{"k":"s","w":"渡邊月","t":"「查到了。那批 SEA 的出貨紀錄，源頭在海垣。」"},"44":{"k":"s","w":"渡邊月","t":"「六年前的收料據點，登記在海垣郊區一棟廢棄醫院。」"},"45":{"k":"n","t":"⋯⋯廢棄醫院。"},"46":{"k":"n","t":"我的胃突然縮了一下。"},"47":{"k":"n","t":"我是海垣人。那棟醫院我應該知道，可是我想不起來。"},"48":{"k":"n","t":"不是忘記。是那一塊被挖掉了。"},"49":{"k":"s","w":"時真一","t":"「明天凌晨出發。海垣。」"},"50":{"k":"s","w":"劉嘉玲","t":"「那就由我們，來把他掀開。」"},"51":{"k":"s","w":"我","t":"「嗯。是該做個了斷了。」"},"52":{"k":"n","t":"我們沒有對抗他們的力量，但我們選擇相信夥伴。"},"53":{"k":"n","t":"至少今晚，我不是一個人。"},"54":{"k":"n","t":"──────────────────────"},"55":{"k":"n","t":"第二天　結束"}},"n":55}},"n":6},"ch04":{"title":"無妄之刻　四","next":"auto","scenes":{"1":{"time":"第三天・凌晨","place":"海垣島　港邊","route":"共通","bgm":"m_quiet","lines":{"1":{"k":"n","t":"天還沒亮，船就靠岸了。"},"2":{"k":"n","t":"從出生起，我就在海垣生活。"},"3":{"k":"n","t":"這裡以漁業為主、畜牧為輔，住的人剩不到三千。"},"4":{"k":"n","t":"也正因為夠偏僻，毒瘤事件、黑霧事件、修羅戰爭。"},"5":{"k":"n","t":"這些東西一件都沒有波及到這裡。"},"6":{"k":"n","t":"大家都說，海垣是這個國境最後的淨土。"},"7":{"k":"n","t":"本該如此的。"},"8":{"k":"n","t":"港邊的燈跟六年前一模一樣，連壞掉的那盞都還壞著。"},"9":{"k":"s","w":"劉嘉玲","t":"「你臉色很差喔。」"},"10":{"k":"s","w":"我","t":"「回家而已，不至於。」"},"11":{"k":"s","w":"劉嘉玲","t":"「騙人。」"},"12":{"k":"n","t":"⋯⋯她真的很討厭別人說謊。"},"13":{"k":"s","w":"時真一","t":"「分兩隊。森林那邊的無妄樹交給我們。」"},"14":{"k":"s","w":"渡邊月","t":"「廢棄醫院那邊人手不多，會有點吃緊。」"},"15":{"k":"s","w":"我","t":"「我去醫院那邊。」"},"16":{"k":"n","t":"這句話是我還沒想清楚就講出來 是它吃了我妹呢。」"},"21":{"k":"n","t":"他握木刀的手在抖，可是背影一點都沒有要退。"},"22":{"k":"n","t":"從小到大，他都在當一個好哥哥。"},"23":{"k":"n","t":"小彌出生的時候，他還跑來問我要怎麼照顧妹妹。"},"24":{"k":"s","w":"我","t":"「我們現在打不過那個。先撤，去找大人。」"},"25":{"k":"s","w":"志雄","t":"「大人⋯⋯」"},"26":{"k":"s","w":"志雄","t":"「大人們如果有用！小彌就不會不見了！」"},"27":{"k":"s","w":"志雄","t":"「我要去救小彌！育賢哥你要走你就走吧！」"},"28":{"k":"n","t":"他舉著木刀往黑暗裡跑。"},"29":{"k":"n","t":"我站在原地看他消失。"},"30":{"k":"n","t":"被人家一路喊育賢哥的人，可以站在這裡不動嗎。"},"31":{"k":"n","t":"不行。靠。我只能硬著頭皮跟上去。"},"32":{"k":"n","t":"洞窟盡頭是一個廣場。"},"33":{"k":"n","t":"有燈、有鐵閘門、有一群穿白袍的人。"},"34":{"k":"n","t":"志雄把我拖進陰影裡。"},"35":{"k":"s","w":"志雄","t":"「你怎麼跟上來了。」"},"36":{"k":"s","w":"我","t":"「我怎麼可能丟下你。」"},"37":{"k":"s","w":"志雄","t":"「我就知道育賢哥不會丟下我。」"},"38":{"k":"n","t":"然後我看見閘門後面走出來的東西。"},"39":{"k":"n","t":"一隻。兩隻。越來越多。"},"40":{"k":"n","t":"多到像一支軍隊，整整齊齊排在廣場上。"},"41":{"k":"s","w":"志雄","t":"「育賢哥，你聽過海垣最近的那個怪談嗎。」"},"42":{"k":"s","w":"志雄","t":"「說這一年小孩子一直失蹤。大家都當是嚇小孩的。」"},"43":{"k":"s","w":"志雄","t":"「可是如果那是真的呢。」"},"44":{"k":"s","w":"志雄","t":"「這些怪物，會不會就是那些小朋友。」"},"45":{"k":"n","t":"他咬著自己的嘴唇。我沒辦法給他任何保證。"},"46":{"k":"n","t":"然後廣場那邊有人喊了一聲，誰在那。"},"47":{"k":"n","t":"靠靠靠靠靠。"},"48":{"k":"s","w":"志雄","t":"「育賢哥，我來保護你吧。就像你保護我那樣。」"},"49":{"k":"s","w":"我","t":"「你在講什麼鬼話！」"},"50":{"k":"s","w":"志雄","t":"「這是個秘密。」"},"51":{"k":"s","w":"志雄","t":"「育賢哥知道我跟爸媽去 Rc 本島度假過吧。」"},"52":{"k":"s","w":"志雄","t":"「我剛好碰上了那場藍月城的大斷電。」"},"53":{"k":"n","t":"他的眼睛閃了一下，然後變成金橘色。"},"54":{"k":"n","t":"那場大斷電之後，陸續有人昏倒送醫。"},"55":{"k":"n","t":"而那些醒過來的人，一個個都拿到了不屬於人的力量。"},"56":{"k":"n","t":"當時給他們的暫定代號叫做，念想能力者。"},"57":{"k":"s","w":"我","t":"「志雄！快跑！有力量就用來跑，去警察局找人！」"},"58":{"k":"s","w":"志雄","t":"「你覺得那些廢物警察打得贏這東西嗎！」"},"59":{"k":"n","t":"我伸手要拉他，他已經跳出去了。"},"60":{"k":"n","t":"一刀。那隻怪物斷成兩截。"},"61":{"k":"s","w":"志雄","t":"「趁現在，我能殺多少是多少，我們得找到小彌！」"},"62":{"k":"s","w":"志雄","t":"「育賢哥你就趁機衝進那個奇怪的實驗室！」"},"63":{"k":"s","w":"志雄","t":"「我會引開所有怪物跟這些大人！」"},"64":{"k":"n","t":"所有的東西都朝他撲過去。"},"65":{"k":"n","t":"他踩著一隻又一隻怪物的肩膀跳開，還回頭挑釁。"},"66":{"k":"s","w":"志雄","t":"「研究出那麼多怪物，還打不贏一個小屁孩啊！」"},"67":{"k":"n","t":"在所有人的目光都在他身上的時候，我衝進了那扇門。"},"68":{"k":"n","t":"裡面是一排一排的床。"},"69":{"k":"n","t":"每張床上都躺著我在鎮上見過的臉。"},"70":{"k":"n","t":"半邊臉爬滿深紅色的痕跡，像被什麼從裡面吃掉。"},"71":{"k":"n","t":"有幾張床上的東西，已經不成人形了。"},"72":{"k":"n","t":"我壓著胃裡的東西，一間一間開門，開到最後一間。"},"73":{"k":"n","t":"裡面的不是那個愛笑的小女孩。"},"74":{"k":"n","t":"那是一團燒著紅光的東西。"},"75":{"k":"n","t":"可是它好像想跟我說什麼。"},"76":{"k":"n","t":"接著周圍突然安靜下來，像被關進另一個空間。"},"77":{"k":"n","t":"我睜開眼睛，看見一整排鳥居。"},"78":{"k":"s","w":"小彌","t":"「育賢哥哥⋯⋯」"},"79":{"k":"s","w":"我","t":"「是⋯⋯小彌嗎。」"},"80":{"k":"s","w":"小彌","t":"「嗯！小彌在這兒！」"},"81":{"k":"s","w":"小彌","t":"「叔叔說哥哥在那邊等我，說要一起吃好吃好玩的。」"},"82":{"k":"n","t":"那不就是誘拐嗎。"},"83":{"k":"s","w":"小彌","t":"「可是小彌好痛。」"},"84":{"k":"s","w":"小彌","t":"「一直要打針針，好痛！」"},"85":{"k":"s","w":"我","t":"「小彌，沒事了。我們回家好嗎。」"},"86":{"k":"s","w":"小彌","t":"「好痛啊————————」"},"87":{"k":"n","t":"鳥居碎掉了。她被一團漩渦吞進去。"},"88":{"k":"n","t":"漩渦越來越大，大到要把我一起吃掉。"},"89":{"k":"s","w":"志雄","t":"「育賢哥————！」"},"90":{"k":"s","w":"志雄","t":"「快跑啊！」"},"91":{"k":"n","t":"他的聲音把我從那個地方拉了出來。"},"92":{"k":"n","t":"我再次睜開眼睛。"},"93":{"k":"n","t":"志雄的胸口，被那隻由小彌變成的東西的爪子貫穿了。"},"94":{"k":"s","w":"志雄","t":"「育賢哥，由我來保護。」"},"95":{"k":"n","t":"他還笑了一下。"},"96":{"k":"n","t":"然後嘴裡湧出血，眼睛瞪得很大，就那樣停住了。"},"97":{"k":"n","t":"我聽見自己在叫。"},"98":{"k":"n","t":"後來那些大人把我當球一樣踢來踢去。"},"99":{"k":"n","t":"有人說，他完全沒反應欸。"},"100":{"k":"n","t":"痛覺很快就麻掉了。"},"101":{"k":"n","t":"可是那個畫面沒有。"},"102":{"k":"n","t":"志雄被刺穿、吐血、瞪大眼睛當場死掉的那一格。"},"103":{"k":"n","t":"我的腦袋怎麼樣都抹不掉它。"},"104":{"k":"n","t":"志雄，是我的錯。"},"105":{"k":"n","t":"如果我不答應陪你來，你就不會來了對不對。"},"106":{"k":"n","t":"無論付出多少代價，無論犧牲什麼。"},"107":{"k":"n","t":"我都要把你們兩個帶回家。"}},"n":107},"4":{"time":"第三天・凌晨","place":"洞窟深處　最裡面那間房","route":"共通","bgm":"m_awaken","lines":{"1":{"k":"n","t":"之後的事，我也全部想起來了。"},"2":{"k":"n","t":"為了方便動腦部手術，他們把我的頭髮剃光。"},"3":{"k":"n","t":"為了控制心跳，他們把會停在心臟上的奈米機器打進去。"},"4":{"k":"n","t":"那些人穿黑袍、戴黑面具，自稱醫生。"},"5":{"k":"s","w":"？？？","t":"「這次的樣本很單純，海垣長大的孩子，很乾淨。」"},"6":{"k":"s","w":"？？？","t":"「這孩子有父母嗎。」"},"7":{"k":"s","w":"？？？","t":"「早年就過世了。是靠鄰居養大的。」"},"8":{"k":"s","w":"？？？","t":"「哎呀⋯⋯真可憐呢。」"}," // 無妄之刻：重製版　網頁版引擎核心
// 忠實移植 FJUJ_Arcade_MWJR.dsc 的狀態機。純邏輯、無 DOM——node 可直接測。
// 唯一刻意修正：Denizen 版 Cast 之後 Next 會把同一道縫再記一次「看著它發生」
// （held 重複計數）。網頁版：只有縫還開著（can==true）時才記 hold。

function mwjrNewState(){
  return {
    ch:'ch00', s:1, l:1, route:'共通',
    used:0, held:0, castp:0,
    can:false,
    tr:{dep:0,zx:0,xm:0,own:0},
    retc:null, rets:null,
    log:[],                       // 回想（一輪內）
    // 跨輪進度
    doneR:false, doorseen:false, doorperfect:false,
    endings:{},                   // name -> true
    over:false                    // 結局畫面中
  };
}

function mwjrEngine(DATA, emit){
  // DATA = {chapters:{...}, people:{...}, music:{...}}
  const S = mwjrNewState();

  function chap(ch){ return DATA.chapters[ch] || null; }
  function scene(ch,s){ const c=chap(ch); return c && c.scenes ? c.scenes[s] : null; }
  function line(ch,s,l){ const sc=scene(ch,s); return sc && sc.lines ? sc.lines[l] : null; }
  function cur(){ return line(S.ch,S.s,S.l); }

  function onRoute(sc){
    const rt = (sc && sc.route) || '共通';
    if (rt==='共通' || rt==='外') return true;
    return rt===S.route;
  }

  // ---- 回想 ----
  function record(kind){
    const sc = scene(S.ch,S.s) || {};
    const li = cur() || {};
    const at = [];
    const n = sc.n||0;
    for (let q=1;q<=n;q++){
      const w = (sc.lines[q]||{}).w;
      if (!w || w==='我' || at.indexOf(w)>=0) continue;
      at.push(w);
    }
    S.log.push({
      k:kind,
      ch:(chap(S.ch)||{}).title||S.ch,
      time:sc.time||'', place:sc.place||'',
      title:li.title||'', was:li.was||'', now:li.now||'',
      at:at.join('、')
    });
  }

  // ---- 畫面（把目前這一句丟給 UI）----
  function render(){
    const c = chap(S.ch); if(!c){ emit('error',{msg:'章節不存在 '+S.ch}); return; }
    const sc = scene(S.ch,S.s); if(!sc){ nextScene(); return; }
    const li = cur();
    const k = li ? li.k : 'end';
    const head = {chapter:c.title, time:sc.time||'', place:sc.place||'', bgm:sc.bgm||'m_daily'};
    if (k==='s'){ emit('line',{head,kind:'s',who:li.w,text:li.t}); }
    else if (k==='n'){ emit('line',{head,kind:'n',text:li.t}); }
    else if (k==='z'){ emit('zhou',{head,title:li.title,text:li.t,fee:li.fee}); }
    else if (k==='g' || k==='m'){
      S.can = true;
      emit('crack',{head,was:li.was,teach:(k==='g')});
    }
    else if (k==='c' || k==='x'){
      const opts=[];
      for(let o=1;o<=4;o++){ if(li['o'+o]!==undefined) opts.push(li['o'+o]); }
      emit('choice',{head,q:li.q||'',opts,fork:(k==='x')});
    }
    else { nextScene(); return; }
    emit('state',{});
  }

  // ---- 推進 ----
  function next(){
    if (S.over) return;
    const li = cur();
    const k = li ? li.k : 'end';
    // 亮著的縫走過去就是忍住。系統只記，不評。（修正：只在縫還開著時記）
    if (k==='m' && S.can){ S.held++; record('hold'); emit('held',{}); }
    S.can = false;
    const sc = scene(S.ch,S.s);
    const n = sc ? (sc.n||0) : 0;
    if (S.l >= n){ nextScene(); return; }
    S.l++;
    render();
  }

  function nextScene(){
    const c = chap(S.ch); const tot = c ? (c.n||0) : 0;
    let found = 0;
    for (let q=1;q<=tot;q++){
      const cand = S.s + q;
      if (cand > tot) break;
      if (onRoute(scene(S.ch,cand))){ found=cand; break; }
    }
    if (found>0){ S.s=found; S.l=1; emit('scene',{}); render(); return; }
    endChapter();
  }

  function setChapter(ch){
    S.ch=ch; S.s=1; S.l=1; S.route='共通'; S.can=false;
    if (ch==='p01') S.castp=0;
    emit('chapter',{title:(chap(ch)||{}).title||ch});
    render();
  }

  function endChapter(){
    const ch=S.ch;
    if (ch==='r04a'){ S.doneR=true; end('cost'); return; }
    if (ch==='r04b'||ch==='r04c'){ S.doneR=true; end('bad'); return; }
    if (ch==='s01'){ end('sun'); return; }
    if (ch==='g01'){ end('giveup'); return; }
    if (ch==='pa'||ch==='pb'){ end('pledge'); return; }
    if (ch==='pc'){ actThree(); return; }
    if (ch==='t06'){ end('true'); return; }
    const nx=(chap(ch)||{}).next||'end';
    if (nx==='auto'){ autoRoute(); return; }
    if (nx==='end'){ end('pledge'); return; }
    if (nx==='door_after'){ doorAfter(); return; }
    if (typeof nx==='string' && nx.indexOf('end_')===0){ end(nx.slice(4)); return; }
    setChapter(nx);
  }

  // ---- 共通篇結算 ----
  function autoRoute(){
    const t=S.tr;
    if (S.doneR){
      if (t.dep<=0 && t.zx<=0 && t.xm<=0 && t.own<=0){ setChapter('g01'); return; }
      setChapter('p01'); return;
    }
    if (t.dep>=2 || t.zx>=2){ setChapter('r01'); return; }
    if (t.own>=6 && t.dep<=0){ setChapter('s01'); return; }
    setChapter('g01');
  }

  // ---- 選擇與分岔 ----
  function applyFlag(f){
    if (!f || f.length<4) return;
    const m=/^([a-z]+)([+-])(\d+)$/.exec(f);
    if (!m) return;
    const trk=m[1], amt=parseInt(m[3],10);
    if (!(trk in S.tr)) S.tr[trk]=0;
    S.tr[trk]+= (m[2]==='-'? -amt: amt);
  }

  function pick(n){
    const li=cur(); if(!li || (li.k!=='c'&&li.k!=='x')) return;
    emit('picked',{text:li['o'+n]||''});
    applyFlag(li['f'+n]);
    if (li.k==='x'){ target(li['t'+n]||'route.共通'); return; }
    const j=li['j'+n];
    if (j!==undefined){ target(j); return; }
    next();
  }

  function target(tg){
    const kind=String(tg).split('.')[0], val=String(tg).slice(kind.length+1);
    if (kind==='route'){
      if (val==='auto'){ autoRoute(); return; }
      S.route=val; next(); return;
    }
    if (kind==='jump'){ S.retc=S.ch; S.rets=S.s; setChapter(val); return; }
    if (kind==='return'){
      const rc=S.retc||S.ch;
      const rs=(S.rets||1)+1;
      S.ch=rc; S.route='共通'; S.can=false;
      if (rs > ((chap(rc)||{}).n||1)){ endChapter(); return; }
      S.s=rs; S.l=1; render(); return;
    }
    next();
  }

  // ---- 發動無妄 ----
  function cast(){
    if (!S.can) return;
    const li=cur(); if(!li || (li.k!=='m'&&li.k!=='g')) return;
    const isM = li.k==='m';
    if (isM){
      S.used++;
      if (S.ch.indexOf('p0')===0) S.castp++;
      record('cast');
    }
    S.can=false;
    emit('cast',{was:li.was,now:li.now,billed:isM});
    // UI 播完動畫要自己呼叫 next()
  }

  // ---- 逆流之後的那扇門 ----
  function doorAfter(){
    S.doorseen=true;
    if (S.route==='丙') S.doorperfect=true;
    emit('doorafter',{});
  }

  function doorPick(ch){ setChapter(ch); }

  function doorRestart(){  // 從那扇門開始
    S.route = S.doorperfect ? '丙' : '乙';
    emit('doorscreen',{perfect:S.doorperfect});
  }

  // ---- 結局 ----
  const END_NAMES={giveup:'放棄', sun:'盛放的向日葵', pledge:'誓守於青空下',
                   cost:'逝者的安魂曲', bad:'逝者的安魂曲　BAD END', 'true':'二律背反'};
  const END_MUS={giveup:'e_giveup', sun:'e_sun', pledge:'e_pledge',
                 cost:'m_cost', bad:'e_bad', 'true':'e_true'};
  function end(name){
    S.endings[name]=true;
    S.over=true;
    emit('end',{name, disp:END_NAMES[name]||name, mus:END_MUS[name]||'e_bad',
                used:S.used, held:S.held,
                extra: name==='pledge' ? '還有一個人，你這一趟沒有去找。' :
                       name==='true' ? '沙　漏' : ''});
  }

  // 誓守 END C 之後：第三幕
  function actThree(){
    emit('actthree',{lines:['那是他的結局。','而我站起來了。']});
    // UI 播完要呼叫 actThreeGo()
  }
  function actThreeGo(){ setChapter('t01'); }

  // ---- 一輪結束、重置（跨輪進度保留）----
  function finish(){
    const keep={doneR:S.doneR, doorseen:S.doorseen, doorperfect:S.doorperfect, endings:S.endings};
    Object.assign(S, mwjrNewState());
    Object.assign(S, keep);
    emit('finished',{});
  }

  function startTop(){ S.over=false; render(); }

  return {S, render, next, pick, cast, doorPick, doorRestart, actThreeGo, finish, startTop,
          setChapter, autoRoute, applyFlag};
}

  else if(type==='zhou'){
    setHead(p.head);
    put(el('zhou','<div class="zt">咒言　'+esc(p.title)+'</div><div class="zx">'+esc(p.text)+'</div><div class="zf">費 —— '+esc(p.fee)+'</div>'));
    setCast(false); setChoiceMode(false);
  }
  else if(type==='crack'){
    setHead(p.head);
    lastCrackEl=el('ln crack',esc(p.was));
    put(lastCrackEl);
    setCast(true); setChoiceMode(false);
  }
  else if(type==='choice'){
    setHead(p.head);
    cho.innerHTML='';
    if(p.q) cho.appendChild(el('q',esc(p.q)));
    p.opts.forEach((t,i)=>{
      const b=document.createElement('button');
      b.className='opt'; b.textContent=t;
      b.onclick=()=>{ if(busy)return; cho.innerHTML=''; E.pick(i+1); save(); };
      cho.appendChild(b);
    });
    setCast(false); setChoiceMode(true);
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  }
  else if(type==='picked'){ put(el('pickecho',esc(p.text))); }
  else if(type==='cast'){
    busy=true; setCast(false);
    if(lastCrackEl) lastCrackEl.className='ln crack done';
    setTimeout(()=>{
      put(el('ln now',esc(p.now)));
      if(p.billed) setTimeout(()=>{ put(el('ln bill','──帳單落下。')); fin(); },420);
      else fin();
      function fin(){ setTimeout(()=>{ busy=false; E.next(); save(); },500); }
    },520);
  }
  else if(type==='held'){ /* 無聲。系統只記，不評。 */ }
  else if(type==='scene'){
    const sc=(MWJR_DATA.chapters[E.S.ch].scenes||{})[E.S.s]||{};
    put(el('div',esc((sc.time||'')+'　'+(sc.place||''))));
  }
  else if(type==='chapter'){
    scr.innerHTML=''; cho.innerHTML='';
    put(el('chcard','<div class="t">'+esc(p.title)+'</div><div class="u">無妄之刻：重製版</div>'));
  }
  else if(type==='actthree'){
    busy=true;
    put(el('div',''));
    let i=0;
    (function step(){
      if(i<p.lines.length){ put(el('ln n',esc(p.lines[i++]))); setTimeout(step,900); }
      else setTimeout(()=>{ busy=false; E.actThreeGo(); save(); },900);
    })();
  }
  else if(type==='doorafter'){ showDoor(); }
  else if(type==='doorscreen'){ showDoor(); }
  else if(type==='end'){
    $('edisp').textContent='結局　〈'+p.disp+'〉';
    $('ecnt').textContent='你動過手 '+p.used+' 次。你看著它發生 '+p.held+' 次。';
    $('eextra').textContent = p.name==='true' ? '' : (p.extra||'');
    $('ehour').style.display = p.name==='true' ? 'block' : 'none';
    $('ecoll').innerHTML=collText();
    $('ovend').classList.add('show');
    save();
  }
  else if(type==='state'){ save(); }
  else if(type==='finished'){ save(); }
}

// ---- 收集 ----
const ENDLIST=[['giveup','放棄'],['bad','逝者　BAD END'],['cost','逝者的安魂曲'],
  ['sun','盛放的向日葵'],['pledge','誓守於青空下'],['true','二律背反']];
function collText(){
  const e=(E?E.S.endings:{})||{};
  const got=ENDLIST.filter(x=>e[x[0]]).map(x=>x[1]);
  return '結局收集　<b>'+got.length+'</b> ／ '+ENDLIST.length+(got.length?'<br>'+got.map(esc).join('　'):'');
}

// ---- 門 ----
function showDoor(){
  const bt=$('doorbtns'); bt.innerHTML='';
  const b1=document.createElement('button');
  b1.className='mb'; b1.innerHTML='<b>把他們留下來</b><br><span style="font-size:12px;color:#5a5264">盛放的向日葵。</span>';
  b1.onclick=()=>{ $('ovdoor').classList.remove('show'); E.doorPick('s01'); save(); };
  bt.appendChild(b1);
  if(E.S.doorperfect){
    const b2=document.createElement('button');
    b2.className='mb'; b2.innerHTML='<b>把他們叫回來</b><br><span style="font-size:12px;color:#5a5264">誓守於青空下。這一條路不用那個力量。</span>';
    b2.onclick=()=>{ $('ovdoor').classList.remove('show'); E.doorPick('p01'); save(); };
    bt.appendChild(b2);
  }
  $('ovdoor').classList.add('show');
}

// ---- 回想 ----
function showLog(){
  const L=E?E.S.log:[];
  $('lgcnt').textContent='你動過手 '+(E?E.S.used:0)+' 次。你看著它發生 '+(E?E.S.held:0)+' 次。這裡不會被改寫影響。';
  const list=$('lglist'); list.innerHTML='';
  if(!L.length){ list.appendChild(el('lg hold','<div class="t1">還沒有東西</div><div class="was">你還沒有動過手。</div>')); }
  L.forEach(r=>{
    const cast=r.k==='cast';
    list.appendChild(el('lg '+(cast?'cast':'hold'),
      '<div class="t1">'+esc(cast?(r.title||'改寫'):(r.title||'你沒有動手'))+'</div>'+
      '<div class="meta">'+esc(r.ch)+'　'+esc(r.time)+'　'+esc(r.place)+'</div>'+
      '<div class="was">原本　'+esc(r.was)+'</div>'+
      (cast?'<div class="now">改寫　'+esc(r.now)+'</div>':'<div class="was">改寫　──</div>')+
      '<div class="at">在場　'+esc(r.at)+'</div>'));
  });
  $('ovlog').classList.add('show');
}

// ---- 標題 ----
function showTitle(){
  ['ovend','ovdoor','ovlog','ovmenu','ovhelp'].forEach(id=>$(id).classList.remove('show'));
  const sv=loadSave();
  const bt=$('tbtns'); bt.innerHTML='';
  function mk(txt,sub,fn,dim){
    const b=document.createElement('button');
    b.className='mb'+(dim?' dim':'');
    b.innerHTML='<b>'+esc(txt)+'</b>'+(sub?'<br><span style="font-size:12px;color:#5a5264">'+esc(sub)+'</span>':'');
    b.onclick=fn; bt.appendChild(b);
  }
  const hasRun = sv && !sv.over && (sv.ch!=='ch00'||sv.s!==1||sv.l!==1);
  if(hasRun) mk('繼續','從上次那一句接著走。',()=>{ boot(sv); $('ovtitle').classList.remove('show'); });
  mk('從頭開始', hasRun?'這一輪的進度會洗掉。結局收集會留著。':'開端。', ()=>{
    boot(freshFrom(metaOf(sv))); $('ovtitle').classList.remove('show');
  });
  if(sv && sv.doorseen) mk('從那扇門開始','逆流之後的岔路口。前面的路你已經走過了。',()=>{
    boot(freshFrom(metaOf(sv)),true); $('ovtitle').classList.remove('show');
  });
  mk('怎麼玩','',()=>$('ovhelp').classList.add('show'));
  const e=(sv&&sv.endings)||{};
  const got=ENDLIST.filter(x=>e[x[0]]).map(x=>x[1]);
  $('tcoll').innerHTML=got.length?('結局收集　<b>'+got.length+'</b> ／ '+ENDLIST.length+'<br>'+got.map(esc).join('　')):'';
  $('ovtitle').classList.add('show');
}
function freshFrom(meta){
  const s=mwjrNewState();
  if(meta) Object.assign(s,meta);
  return s;
}
function boot(state, fromDoor){
  scr.innerHTML=''; cho.innerHTML=''; lastCrackEl=null; busy=false;
  E=mwjrEngine(MWJR_DATA, emit);
  Object.assign(E.S, state);
  if(fromDoor){ E.doorRestart(); save(); return; }
  const c=(MWJR_DATA.chapters[E.S.ch]||{});
  emit('chapter',{title:c.title||'序'});
  E.S.over=false;
  E.render();
  save();
}

// ---- 操作 ----
$('bnext').onclick=()=>{ if(busy||!E||inChoice) return;
  if(E.S.can){ /* 走過去＝忍住 */ }
  E.next(); save(); };
$('bcast').onclick=()=>{ if(busy||!E) return; if(!E.S.can) return; E.cast(); };
scr.onclick=()=>{ if(busy||!E||inChoice) return; E.next(); save(); };
$('bmenu').onclick=()=>$('ovmenu').classList.add('show');
$('mback').onclick=()=>$('ovmenu').classList.remove('show');
$('mlog').onclick=()=>{ $('ovmenu').classList.remove('show'); showLog(); };
$('lgback').onclick=()=>$('ovlog').classList.remove('show');
$('mhelp').onclick=()=>{ $('ovmenu').classList.remove('show'); $('ovhelp').classList.add('show'); };
$('hback').onclick=()=>$('ovhelp').classList.remove('show');
$('mtitle').onclick=()=>{ $('ovmenu').classList.remove('show'); save(); showTitle(); };
$('eback').onclick=()=>{ if(E){ E.finish(); } showTitle(); };

showTitle();
})();
</script>
